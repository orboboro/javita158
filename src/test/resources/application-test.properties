# Usato SOLO con @ActiveProfiles("test"). Stesso server/container della demo,
# database separato: creare una volta tropico_test prima di eseguire mvn test.
# Username e password sono quelli di application.properties.
spring.datasource.url=jdbc:postgresql://localhost:5432/tropico_test?connectTimeout=5&socketTimeout=10
# Validiamo le entity contro il DDL reale, inclusi CHAR, DECIMAL e sequenze SERIAL.
spring.jpa.hibernate.ddl-auto=validate
# Solo CREATE TABLE IF NOT EXISTS: nessun seed, DROP o DELETE dei dati della demo.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/tropico-test-schema.sql
spring.jpa.open-in-view=false
# Per osservare le query durante lo studio, cambiare questi livelli in DEBUG/TRACE.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
