spring.application.name=javita158
# Seleziona una sola implementazione: jpa (predefinita) oppure in-memory.
spring.profiles.default=jpa

spring.datasource.url=jdbc:postgresql://localhost:5432/tropico
spring.datasource.username=postgresMaster
