# Attivazione: --spring.profiles.active=company
# Credenziali ereditate da application.properties; si possono sovrascrivere con
# SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=${COMPANY_DB_URL:jdbc:postgresql://localhost:5432/company}
# Il database deve esistere: nessuna creazione, modifica o inizializzazione automatica.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.open-in-view=false
